# ============================================================
# GS08 - Matriculas y Notas | despliegue en Coolify (VPS propio)
#
#   Diferencia con docker-compose.yml (local):
#     * NO publica puertos al host: el proxy Traefik de Coolify
#       es el unico que escucha en 80/443 y enruta por dominio.
#     * El servicio `web` declara SERVICE_FQDN_WEB_8080, que es
#       la variable con la que Coolify asigna el dominio publico
#       y genera el certificado Let's Encrypt.
#     * Limites de memoria por servicio: el VPS ya hospeda n8n,
#       evolution, qdrant, postgres y redis en produccion.
#
#   Dominio: https://gs08-matriculas.mlarca.com  (registro A -> 5.161.121.2)
#
#   Sin `name:` a proposito: Coolify impone el nombre del proyecto compose
#   (lo usa para sus labels de Traefik y para bajar el stack); fijarlo aqui
#   rompe esa gestion.
# ============================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-common: &api-common
  build:
    context: ./backend
    target: runtime
  image: gs08-api:prod
  restart: unless-stopped
  mem_limit: 384m
  environment:
    ENVIRONMENT: production
    LOG_LEVEL: ${LOG_LEVEL:-info}
    TZ: America/Lima
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gs08}:${POSTGRES_PASSWORD:-gs08_dev_pwd}@gs08-db:5432/${POSTGRES_DB:-gs08_matriculas}
    SECRET_KEY: ${SECRET_KEY:-cambiar-esta-clave-en-produccion}
    ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
  depends_on:
    db:
      condition: service_healthy
    # El esquema y la semilla los garantiza "migraciones" antes de arrancar.
    migraciones:
      condition: service_started
  networks: [gs08]
  logging: *default-logging

services:
  # ---------------- Base de datos ----------------
  db:
    image: postgres:16.15-alpine3.24
    restart: unless-stopped
    mem_limit: 320m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gs08_matriculas}
      POSTGRES_USER: ${POSTGRES_USER:-gs08}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gs08_dev_pwd}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: America/Lima
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Los *.sql de esta carpeta se ejecutan UNA vez, al crear el volumen:
      # esquema, vista, semilla y notas del modelo legacy.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gs08} -d ${POSTGRES_DB:-gs08_matriculas}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      gs08:
        aliases: [gs08-db]
    logging: *default-logging

  # ---------------- Esquema y datos iniciales ----------------
  # Postgres solo ejecuta /docker-entrypoint-initdb.d la primera vez que crea el
  # volumen de datos; si ese volumen ya existia (o nacio en un despliegue
  # fallido) la base queda vacia y el login responde 500. Este servicio aplica
  # los .sql que falten. El script es idempotente: si la tabla usuarios ya
  # existe no toca nada, asi que puede correr en cada despliegue.
  migraciones:
    image: postgres:16.15-alpine3.24
    # Coolify marca el despliegue como fallido si un contenedor del stack sale
    # (aunque salga con 0), asi que este aplica el esquema y se queda en espera.
    restart: unless-stopped
    mem_limit: 128m
    environment:
      PGHOST: gs08-db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-gs08_matriculas}
      PGUSER: ${POSTGRES_USER:-gs08}
      PGPASSWORD: ${POSTGRES_PASSWORD:-gs08_dev_pwd}
      TZ: America/Lima
    volumes:
      - ./db/init:/sql:ro
      - ./db/bootstrap:/bootstrap:ro
    command: ["sh", "-c", "/bootstrap/aplicar-esquema.sh; echo 'Bootstrap aplicado: el contenedor queda en espera (Coolify exige que no termine).'; sleep infinity"]
    depends_on:
      db:
        condition: service_healthy
    networks: [gs08]
    logging: *default-logging

  # ---------------- API FastAPI (2 instancias -> nginx balancea) ----------------
  # Alias propios dentro de la red interna. Sin ellos, en la red compartida del
  # proxy puede haber otro contenedor llamado "api" de otro proyecto, y nginx
  # resuelve su IP: "connect() failed ... http://[fd58:...]:8000" (fallo real).
  api:
    <<: *api-common
    networks:
      gs08:
        aliases: [gs08-api]

  api-b:
    <<: *api-common
    networks:
      gs08:
        aliases: [gs08-api-b]

  # ---------------- Frontend Vue + nginx (proxy inverso publico) ----------------
  web:
    build:
      context: ./frontend
      target: runtime
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: gs08-web:prod
    restart: unless-stopped
    mem_limit: 128m
    # El proxy de Coolify enruta al puerto 80 (el EXPOSE que la imagen nginx
    # hereda de su base), asi que aqui nginx escucha en 80 y necesita root
    # para poder abrir un puerto privilegiado. En local y Kubernetes sigue
    # en 8080 sin privilegios.
    user: root
    environment:
      # Round-robin entre las dos instancias de la API, por sus alias internos;
      # si una no responde, nginx la marca caida 10 s y manda todo a la otra.
      API_UPSTREAM: "server gs08-api:8000 max_fails=3 fail_timeout=10s; server gs08-api-b:8000 max_fails=3 fail_timeout=10s;"
      TZ: America/Lima
      NGINX_LISTEN_PORT: "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      - api
      - api-b
    # web es el unico servicio publicado: necesita la red del proxy de Coolify
    # (externa) ademas de la red interna del proyecto.
    networks: [coolify, gs08]
    # Con dos redes conectadas, Traefik debe usar la IP de la red del proxy;
    # sin esta label elige la interna, no la alcanza y responde 502.
    labels:
      - "traefik.docker.network=coolify"
    logging: *default-logging

volumes:
  pgdata:

networks:
  # Red del proxy Traefik de Coolify: sin esto, Traefik no ve el contenedor
  # y el dominio responde 502 Bad Gateway.
  coolify:
    external: true
  # Red interna: db, api y api-b solo se hablan entre ellos.
  gs08:
