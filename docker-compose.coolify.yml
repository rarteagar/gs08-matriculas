# ============================================================
# GS08 - Matriculas y Notas | despliegue en Coolify (VPS propio)
#
#   Diferencia con docker-compose.yml (local):
#     * NO publica puertos al host: el proxy Traefik de Coolify
#       es el unico que escucha en 80/443 y enruta por dominio.
#     * El servicio `web` declara SERVICE_FQDN_WEB_8080, que es
#       la variable con la que Coolify asigna el dominio publico
#       y genera el certificado Let's Encrypt.
#     * Limites de memoria por servicio: el VPS ya hospeda n8n,
#       evolution, qdrant, postgres y redis en produccion.
#
#   Dominio: https://gs08-matriculas.mlarca.com  (registro A -> 5.161.121.2)
#
#   Sin `name:` a proposito: Coolify impone el nombre del proyecto compose
#   (lo usa para sus labels de Traefik y para bajar el stack); fijarlo aqui
#   rompe esa gestion.
# ============================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-common: &api-common
  build:
    context: ./backend
    target: runtime
  image: gs08-api:prod
  restart: unless-stopped
  mem_limit: 384m
  environment:
    ENVIRONMENT: production
    LOG_LEVEL: ${LOG_LEVEL:-info}
    TZ: America/Lima
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gs08}:${POSTGRES_PASSWORD:-gs08_dev_pwd}@db:5432/${POSTGRES_DB:-gs08_matriculas}
    SECRET_KEY: ${SECRET_KEY:-cambiar-esta-clave-en-produccion}
    ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
  depends_on:
    db:
      condition: service_healthy
    # El esquema y la semilla los garantiza "migraciones" antes de arrancar.
    migraciones:
      condition: service_completed_successfully
  networks: [gs08]
  logging: *default-logging

services:
  # ---------------- Base de datos ----------------
  db:
    image: postgres:16.15-alpine3.24
    restart: unless-stopped
    mem_limit: 320m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gs08_matriculas}
      POSTGRES_USER: ${POSTGRES_USER:-gs08}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gs08_dev_pwd}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: America/Lima
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Los *.sql de esta carpeta se ejecutan UNA vez, al crear el volumen:
      # esquema, vista, semilla y notas del modelo legacy.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gs08} -d ${POSTGRES_DB:-gs08_matriculas}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks: [gs08]
    logging: *default-logging

  # ---------------- Esquema y datos iniciales ----------------
  # Postgres solo ejecuta /docker-entrypoint-initdb.d la PRIMERA vez que crea el
  # volumen de datos. En un servidor donde ese volumen ya existia, la base queda
  # vacia y el login responde 500 (no existe la tabla usuarios). Este servicio
  # aplica los .sql que falten; son idempotentes (IF NOT EXISTS / ON CONFLICT) y
  # si la tabla usuarios ya existe no toca nada.
  migraciones:
    image: postgres:16.15-alpine3.24
    restart: "no"
    mem_limit: 128m
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-gs08_matriculas}
      PGUSER: ${POSTGRES_USER:-gs08}
      PGPASSWORD: ${POSTGRES_PASSWORD:-gs08_dev_pwd}
      TZ: America/Lima
    volumes:
      - ./db/init:/sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        n=$$(psql -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name='usuarios'")
        if [ "$$n" = "0" ]; then
          echo "Base sin esquema: se aplican los .sql de db/init"
          for f in /sql/01-schema.sql /sql/02-view.sql /sql/03-seed.sql /sql/04-notas.sql; do
            echo "  -> $$f"
            psql -v ON_ERROR_STOP=1 -q -f "$$f"
          done
          echo "Esquema, vista y datos iniciales aplicados."
        else
          echo "El esquema ya existe: no se aplica nada."
        fi
    depends_on:
      db:
        condition: service_healthy
    networks: [gs08]
    logging: *default-logging

  # ---------------- API FastAPI (2 instancias -> nginx balancea) ----------------
  api:
    <<: *api-common

  api-b:
    <<: *api-common

  # ---------------- Frontend Vue + nginx (proxy inverso publico) ----------------
  web:
    build:
      context: ./frontend
      target: runtime
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: gs08-web:prod
    restart: unless-stopped
    mem_limit: 128m
    # El proxy de Coolify enruta al puerto 80 (el EXPOSE que la imagen nginx
    # hereda de su base), asi que aqui nginx escucha en 80 y necesita root
    # para poder abrir un puerto privilegiado. En local y Kubernetes sigue
    # en 8080 sin privilegios.
    user: root
    environment:
      # Round-robin entre las dos instancias de la API; si una no responde,
      # nginx la marca caida 10 s y manda todo el trafico a la otra.
      API_UPSTREAM: "server api:8000 max_fails=3 fail_timeout=10s; server api-b:8000 max_fails=3 fail_timeout=10s;"
      TZ: America/Lima
      NGINX_LISTEN_PORT: "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      - api
      - api-b
    # web es el unico servicio publicado: necesita la red del proxy de Coolify
    # (externa) ademas de la red interna del proyecto.
    networks: [coolify, gs08]
    # Con dos redes conectadas, Traefik debe usar la IP de la red del proxy;
    # sin esta label elige la interna, no la alcanza y responde 502.
    labels:
      - "traefik.docker.network=coolify"
    logging: *default-logging

volumes:
  pgdata:

networks:
  # Red del proxy Traefik de Coolify: sin esto, Traefik no ve el contenedor
  # y el dominio responde 502 Bad Gateway.
  coolify:
    external: true
  # Red interna: db, api y api-b solo se hablan entre ellos.
  gs08:
