# ============================================================
# GS08 - Matriculas | CI: validacion de infra + lint + pruebas + build de imagenes
# Corre en cada pull request y en push a main.
# Nota: hasta el Sprint 0 solo habia infraestructura y los jobs de aplicacion se
# saltaban con hashFiles() en el if del job. GitHub NO admite hashFiles() a nivel
# de job (solo dentro de steps, despues del checkout), asi que ahora esos jobs
# corren siempre: su codigo ya existe.
# ============================================================
name: CI · Integración continua

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------
  # 1. Infraestructura: corre siempre, incluso sin codigo de app
  # ---------------------------------------------------------
  infra:
    name: Validación de Dockerfiles, compose y manifiestos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validar YAML, panel de Grafana, Dockerfile y versiones fijadas
        run: python3 scripts/validar_infra.py

      - name: Validar docker-compose (sintaxis y sustitución de variables)
        run: docker compose config -q && docker compose config --services

      - name: Compilar la imagen del API (la necesita el control de D-14)
        run: docker compose build api

      # TC-08: control automatico de D-14 (una sola fuente de verdad del esquema).
      # El script sale 0 si db/init/ y Alembic coinciden, 1 si difieren y 2 si la
      # foto del catalogo fallo: cualquiera de los dos ultimos rompe el job.
      - name: Control de D-14 (db/init/ frente a la revisión inicial de Alembic)
        run: |
          if bash db/verificacion/comparar_con_alembic.sh; then
            echo "OK: db/init/ y la revisión inicial de Alembic dejan el mismo esquema (D-14)"
          else
            echo "::error::D-14 rota: db/init/ y Alembic difieren, o la foto del catálogo falló (exit != 0)"
            exit 1
          fi

      - name: Catálogo de D-14 como evidencia (se guarda siempre)
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: d14-catalogo-esquema
          path: docs/analisis/evidencia/
          retention-days: 7
          if-no-files-found: ignore

      - name: Revisión estática del Dockerfile del API (hadolint)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: error

      - name: Revisión estática del Dockerfile del frontend (hadolint)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: error

  # ---------------------------------------------------------
  # 2. Backend FastAPI: lint + pruebas contra PostgreSQL 16
  # ---------------------------------------------------------
  backend:
    name: Backend · lint y pruebas (ruff + pytest)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_DB: gs08_test
          POSTGRES_USER: gs08
          POSTGRES_PASSWORD: gs08_test_pwd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gs08 -d gs08_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://gs08:gs08_test_pwd@localhost:5432/gs08_test
      ENVIRONMENT: test
      SECRET_KEY: clave-solo-para-ci
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install ruff pytest pytest-cov
          fi

      - name: Revisión de estilo y formato (ruff)
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Pruebas (pytest)
        working-directory: backend
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=60

  # ---------------------------------------------------------
  # 3. Frontend Vue: lint + pruebas + build de produccion
  # ---------------------------------------------------------
  frontend:
    name: Frontend · lint, pruebas y compilación (eslint + vitest + build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Revisión estática (eslint)
        working-directory: frontend
        run: npm run lint --if-present

      - name: Pruebas unitarias (vitest)
        working-directory: frontend
        run: npm run test:unit --if-present

      - name: Compilación de producción
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run build

      - name: Publicar el paquete compilado como artefacto
        uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------
  # 4. Build real de las imagenes + smoke test del stack
  #    (levanta db + 2 APIs + nginx, igual que en local)
  # ---------------------------------------------------------
  imagenes:
    name: Compilación de imágenes y prueba de humo
    runs-on: ubuntu-24.04
    needs: [infra, backend, frontend]
    if: ${{ !cancelled() && !failure() && needs.infra.result == 'success' }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Construir las imágenes con docker compose
        run: docker compose build

      - name: Levantar el entorno
        run: docker compose up -d

      - name: Esperar y probar los chequeos de salud
        run: |
          docker compose ps
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz && break || sleep 5
          done
          # Con reintentos: los contenedores pueden seguir en "health: starting"
          # y un curl sin --retry muere con "Connection reset by peer" (exit 56).
          curl --retry 15 --retry-connrefused --retry-delay 4 -fsS http://localhost:8080/healthz
          curl --retry 15 --retry-connrefused --retry-delay 4 -fsS http://localhost:8000/health
          curl --retry 15 --retry-connrefused --retry-delay 4 -fsS http://localhost:8000/metrics | head -20

      - name: Registros si algo falla
        if: failure()
        run: docker compose logs --no-color

      - name: Escaneo de vulnerabilidades (informativo)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gs08-api:local
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

      - name: Bajar el entorno
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------
  # 5. Puerta final: este es el check que exige la rama main
  # ---------------------------------------------------------
  ci-ok:
    name: CI en verde (puerta final)
    runs-on: ubuntu-24.04
    needs: [infra, backend, frontend, imagenes]
    if: ${{ always() }}
    steps:
      - name: Verificar resultados
        run: |
          echo "infra=${{ needs.infra.result }} backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }} imagenes=${{ needs.imagenes.result }}"
          if [ "${{ needs.infra.result }}" != "success" ]; then
            echo "::error::la validación de infraestructura falló"
            exit 1
          fi
          for r in "${{ needs.backend.result }}" "${{ needs.frontend.result }}" "${{ needs.imagenes.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::trabajo requerido en estado $r"
              exit 1
            fi
          done
          echo "CI en verde (los trabajos sin código de aplicación se reportan como omitidos)"
