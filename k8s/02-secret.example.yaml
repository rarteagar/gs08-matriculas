# ============================================================
# PLANTILLA de Secret. NO commitear el lleno: k8s/02-secret.yaml esta en .gitignore
#
# Crear el real con kubectl (recomendado, no queda en el historial de git):
#   kubectl -n gs08 create secret generic gs08-secrets \
#     --from-literal=POSTGRES_PASSWORD='<clave-bd>' \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=DATABASE_URL='postgresql+psycopg://gs08:<clave-bd>@gs08-db:5432/gs08_matriculas' \
#     --dry-run=client -o yaml > k8s/02-secret.yaml
#   kubectl apply -f k8s/02-secret.yaml
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: gs08-secrets
  labels:
    app.kubernetes.io/part-of: gs08-matriculas
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CAMBIAR_clave-bd"
  SECRET_KEY: "CAMBIAR_clave-de-firma-jwt"
  DATABASE_URL: "postgresql+psycopg://gs08:CAMBIAR_clave-bd@gs08-db:5432/gs08_matriculas"
