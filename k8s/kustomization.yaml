# ============================================================
# Aplicar todo:  kubectl apply -k k8s/
# El Secret NO esta aqui a proposito (se crea aparte, ver 02-secret.example.yaml)
# ============================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gs08

resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 10-postgres.yaml
  - 15-migracion-job.yaml
  - 20-api.yaml
  - 30-web.yaml
  - 40-ingress.yaml

# Sustentacion local (minikube con driver docker): se usan las imagenes construidas
# en esta maquina, cargadas con `minikube image load`. El CD las reemplaza por las de
# GHCR con `kubectl set image` (ver .github/workflows/cd.yml), no depende de este tag.
images:
  - name: ghcr.io/cambiar-usuario/gs08-api
    newName: gs08-api
    newTag: local
  - name: ghcr.io/cambiar-usuario/gs08-web
    newName: gs08-web
    newTag: local

# En el cluster local de la sustentacion corre 1 replica por Deployment (3 pods:
# gs08-db, gs08-api, gs08-web). El balanceo entre dos instancias del API se demuestra
# con Docker Compose (criterio C-35); los Deployment quedan preparados para escalar.
replicas:
  - name: gs08-api
    count: 1
  - name: gs08-web
    count: 1

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: gs08-matriculas
      app.kubernetes.io/managed-by: kustomize
