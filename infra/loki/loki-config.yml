# ============================================================
# GS08 · Matrículas y Notas | infra/loki/loki-config.yml
# Loki en modo monolítico: guarda los logs en el volumen `lokidata`.
# El API le empuja los suyos por HTTP (LOKI_URL), así no hace falta Promtail
# ni montar el socket de Docker (funciona igual en Windows y en el VPS).
# Se levanta con: docker compose --profile obs up -d
# ============================================================
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 336h          # 14 días de logs
  allow_structured_metadata: true
  reject_old_samples: false
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
