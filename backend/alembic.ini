# ============================================================
# GS08 · Matrículas y Notas | Alembic
# Autor: @dev | T1.1 | Sprint 1
# La URL de conexión NO se escribe aquí: la lee alembic/env.py de la variable
# de entorno DATABASE_URL (la misma que usa el API y que inyecta compose/k8s).
#   alembic upgrade head      -> aplica la revisión 0001 (espejo de db/init/*.sql)
#   alembic current / history
# En el cluster lo corre el Job gs08-migraciones (k8s/15-migracion-job.yaml).
# ============================================================
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# versiones con nombre explícito: la revisión inicial está generada, no autogenerada
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
